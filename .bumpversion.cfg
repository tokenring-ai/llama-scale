[bumpversion]
current_version = 1.0.7
commit = False
tag = False
allow-dirty = True

[bumpversion:file:Cargo.toml]

[bumpversion:file:Cargo.lock]
search = name = "llama-scale"
    version = "{current_version}"
replace = name = "llama-scale"
    version = "{new_version}"

[bumpversion:file:packaging/npm/package.json]

[bumpversion:file:install.sh]
search = VERSION_PIN="{current_version}"
replace = VERSION_PIN="{new_version}"
